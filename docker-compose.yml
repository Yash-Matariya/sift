# Brings up the whole stack with one command: `docker compose up`.
#   db     - Postgres with the pgvector extension (stores chunks + embeddings)
#   redis  - the Celery broker/result backend (the ingestion job queue)
#   ollama - runs the LLM and embedding model locally (free, no API key)
#   api    - the FastAPI app (accepts uploads, answers questions)
#   worker - the Celery worker that ingests documents in the background
#
# The api and worker run from the SAME image with different commands, and share
# an `uploads` volume so the worker can read files the api saved.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
      POSTGRES_DB: sift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  api:
    build: .
    depends_on:
      - db
      - redis
      - ollama
    environment:
      DATABASE_URL: postgresql+psycopg://sift:sift@db:5432/sift
      OLLAMA_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
      - ollama
    environment:
      DATABASE_URL: postgresql+psycopg://sift:sift@db:5432/sift
      OLLAMA_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  ollama:
  uploads:
